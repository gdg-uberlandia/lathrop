name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - devfest-triangulo-2025
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Make script executable
        run: chmod +x ./scripts/generate_env.sh
      - name: Generate environment file
        run: scripts/generate_env.sh "${{ secrets.ENV_BASE64 }}"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVFEST_TRIANGULO_2025 }}
          channelId: live
          projectId: devfest-triangulo-2025
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

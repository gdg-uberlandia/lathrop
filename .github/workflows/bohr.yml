name: bohr.io deploy
on:
  push:
  repository_dispatch:
    types: [bohr-dispatch]
permissions: write-all
jobs:
  deploy:
    name: Deploy on bohr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: scripts/generate_env.sh "${{ secrets.ENV_BASE64 }}"
      - uses: bohr-io/action@main
